[tasks."clean"]
description = "Clean up old packages and caches"
run = { tasks = ["clean:packages", "clean:mise", "clean:dfm"] }

[tasks."clean:packages"]
description = "Prune mise-owned direct-manager packages without removing native packages"
run = [{ task = "clean:packages:mise" }]

[tasks."clean:packages:mise"]
description = "Prune mise-owned direct-manager packages without removing native packages"
run = '''
{% if vars.dotfiles_homebrew_enabled == "true" %}
mise bootstrap packages prune --manager brew-cask --yes
{% else %}
:
{% endif %}
'''

[tasks."clean:mise"]
description = "Mise prune"
run = "mise prune -y"

[tasks."clean:dfm"]
description = "Clean dfm created .backup folders"
run = "fd -H '^.backup$' --type dir ~ -X rmdir {}"
