[vars]
zsh_plugin_list_file = "{{ config_root }}/.config/zsh/.zsh_plugins.txt"
zsh_plugin_static_file = "{{ xdg_cache_home }}/zsh/antidote/.zsh_plugins.zsh"

[tasks."bootstrap"]
description = "Configure the environment after mise converges packages and tools"
run = [{ tasks = ["bootstrap:configure"] }]

[tasks."bootstrap:configure"]
description = "Configure the environment after bootstrap installs complete"
run = [
  { tasks = [
    "bootstrap:antidote",
    "bootstrap:packages:zsh_permissions",
  ] },
  { tasks = [
    "bootstrap:for_env",
    "bootstrap:workstation",
  ] },
  { task = "bootstrap:install-homebrew" },
  { task = "homebrew:install" },
  { tasks = [
    "bootstrap:work-workstation",
    "bootstrap:personal-gui",
  ] },
  { tasks = [
    "bootstrap:bat_cache",
    "bootstrap:gh:extensions",
    "bootstrap:secrets",
  ] },
  { tasks = [
    "bootstrap:checks",
  ] },
]

[tasks."bootstrap:antidote"]
description = "Converge the live Antidote source and build zsh plugin bundles"
run = """
#!/usr/bin/env zsh
antidote_source_dir="${ZDOTDIR:-${XDG_CONFIG_HOME:-$HOME/.config}/zsh}/.antidote"
if [[ ! -d "$antidote_source_dir/.git" ]]; then
  mkdir -p "$(dirname "$antidote_source_dir")"
  git clone --depth=1 https://github.com/mattmc3/antidote.git "$antidote_source_dir"
fi

source "$antidote_source_dir/antidote.zsh"
mkdir -p "$(dirname "{{ vars.zsh_plugin_static_file }}")"
antidote bundle <"{{ vars.zsh_plugin_list_file }}" >|"{{ vars.zsh_plugin_static_file }}"
"""

[tasks."bootstrap:bat_cache"]
description = "Build the bat cache after package installation"
run = [{ tasks = ["update:bat_cache"] }]

[tasks."bootstrap:packages:zsh_permissions"]
description = "Fix direct-Brew zsh completion permissions for compinit on Linux/WSL"
run = '''
site_functions="/home/linuxbrew/.linuxbrew/share/zsh/site-functions"
if [ -d "$site_functions" ]; then
  chmod -R go-w "$site_functions"
fi
'''

[tasks."bootstrap:gh:extensions"]
description = "Install gh extensions if gh is installed and authenticated"
run = '''
if gh auth status >/dev/null 2>&1; then
  echo "Installing gh extensions..."
  gh extension install https://github.com/dlvhdr/gh-dash
  gh extension install https://github.com/dlvhdr/gh-enhance
  # gh extension install https://github.com/eikster-dk/gh-worktree
else
  echo "gh not authenticated, skipping extension install."
fi
'''

[tasks."bootstrap:secrets"]
description = "Render secret-backed config files if supported in this environment"
run = '''
if mise tasks | grep -qE '^\s*secrets:render(\s|$)'; then
  if ! mise run secrets:render; then
    echo "Secret config rendering failed; continuing without generated secret files."
  fi
fi
'''

[tasks."bootstrap:checks"]
description = "Print quick bootstrap sanity checks"
run = '''
for command_name in git curl zsh nvim; do
  if command -v "$command_name" >/dev/null 2>&1; then
    printf "  %s: %s\n" "$command_name" "$(command -v "$command_name")"
  else
    printf "  %s: missing\n" "$command_name"
  fi
done
mise --version
mise bootstrap status
'''

[tasks."bootstrap:for_env"]
description = "No-op hook for environment-specific bootstrap additions"
run = ":"

[tasks."bootstrap:workstation"]
description = "No-op workstation bootstrap hook"
run = ":"

[tasks."bootstrap:work-workstation"]
description = "No-op work workstation bootstrap hook"
run = ":"

[tasks."bootstrap:personal-gui"]
description = "No-op personal GUI bootstrap hook"
run = ":"

[tasks."gh:auth"]
description = "Run interactive gh auth login if not authenticated"
confirm = "Run interactive gh auth login if not authed?"
raw = true
run = "if ! gh auth status >/dev/null 2>&1; then gh auth login; fi"
