# ~/.config/tealdeer/config.toml
# Generated by configurator.fyi/tealdeer

[display]
compact = false
use_pager = true
show_title = true

[updates]
auto_update = true
auto_update_interval_hours = 720

[style.command_name]
foreground = "blue"
bold = true

[style.example_code]
foreground = "yellow"

[style.example_variable]
foreground = "green"
italic = true
