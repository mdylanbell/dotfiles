# =============================================================================
# GLOBAL SETTINGS
# =============================================================================
config-version = 2

start-at-login = true
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

gaps.inner.horizontal = 8
gaps.inner.vertical = 8
gaps.outer.left = 6
gaps.outer.bottom = 6
gaps.outer.top = 6
gaps.outer.right = 6

after-startup-command = [
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]

# =============================================================================
# MAIN MODE
# =============================================================================
# Hyper is emitted by physical Left Control via Karabiner:
# cmd + ctrl + alt + shift.
[mode.main.binding]
cmd-ctrl-alt-shift-space = [
  "mode leader",
  "exec-and-forget borders active_color=0xfff9e2af inactive_color=0xff494d64 width=7.0",
]

cmd-ctrl-alt-shift-a = [
  "mode adjust",
  "exec-and-forget borders active_color=0xffff5f57 inactive_color=0xff494d64 width=8.0",
]

ctrl-left = "workspace --no-stdin prev"
ctrl-right = "workspace --no-stdin next"
alt-tab = "workspace-back-and-forth"
alt-shift-tab = "move-workspace-to-monitor --wrap-around next"
alt-slash = "layout tiles horizontal vertical"
alt-comma = "layout accordion horizontal vertical"

# Hyper navigation: fast, always available, no modal state.
cmd-ctrl-alt-shift-h = "focus left"
cmd-ctrl-alt-shift-j = "focus down"
cmd-ctrl-alt-shift-k = "focus up"
cmd-ctrl-alt-shift-l = "focus right"

cmd-ctrl-alt-shift-leftSquareBracket = "focus dfs-prev"
cmd-ctrl-alt-shift-rightSquareBracket = "focus dfs-next"
cmd-ctrl-alt-shift-tab = "focus-back-and-forth"

cmd-ctrl-alt-shift-left = "focus-monitor prev"
cmd-ctrl-alt-shift-right = "focus-monitor next"

cmd-ctrl-alt-shift-1 = "workspace 1"
cmd-ctrl-alt-shift-2 = "workspace 2"
cmd-ctrl-alt-shift-3 = "workspace 3"
cmd-ctrl-alt-shift-4 = "workspace 4"
cmd-ctrl-alt-shift-5 = "workspace 5"
cmd-ctrl-alt-shift-6 = "workspace 6"

# =============================================================================
# LEADER MODE
# =============================================================================
# One-shot command palette. Commands return to main unless they explicitly enter
# another mode.
[mode.leader.binding]
# Hyper navigation remains available while the leader is active.
cmd-ctrl-alt-shift-h = "focus left"
cmd-ctrl-alt-shift-j = "focus down"
cmd-ctrl-alt-shift-k = "focus up"
cmd-ctrl-alt-shift-l = "focus right"

cmd-ctrl-alt-shift-leftSquareBracket = "focus dfs-prev"
cmd-ctrl-alt-shift-rightSquareBracket = "focus dfs-next"
cmd-ctrl-alt-shift-tab = "focus-back-and-forth"

cmd-ctrl-alt-shift-1 = "workspace 1"
cmd-ctrl-alt-shift-2 = "workspace 2"
cmd-ctrl-alt-shift-3 = "workspace 3"
cmd-ctrl-alt-shift-4 = "workspace 4"
cmd-ctrl-alt-shift-5 = "workspace 5"
cmd-ctrl-alt-shift-6 = "workspace 6"

esc = [
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]
enter = [
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]

# Swallow common macOS app/window shortcuts while AeroSpace owns the leader.
cmd-h = "true"
cmd-m = "true"
cmd-w = "true"

shift-slash = [
  "exec-and-forget /bin/zsh -lc '~/.config/aerospace/show-leader-help.sh'",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]
d = [
  "exec-and-forget /bin/zsh -lc '~/.config/aerospace/show-diagnostics.sh'",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]

a = [
  "mode adjust",
  "exec-and-forget borders active_color=0xffff5f57 inactive_color=0xff494d64 width=8.0",
]

z = [
  "fullscreen",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]
f = [
  "layout floating tiling",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]
backspace = [
  "flatten-workspace-tree",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]
equal = [
  "balance-sizes",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]

1 = [
  "move-node-to-workspace 1",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]
2 = [
  "move-node-to-workspace 2",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]
3 = [
  "move-node-to-workspace 3",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]
4 = [
  "move-node-to-workspace 4",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]
5 = [
  "move-node-to-workspace 5",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]
6 = [
  "move-node-to-workspace 6",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]
leftSquareBracket = [
  "move-node-to-workspace prev",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]
rightSquareBracket = [
  "move-node-to-workspace next",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]

alt-shift-1 = [
  "move-node-to-workspace --focus-follows-window 1",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]
alt-shift-2 = [
  "move-node-to-workspace --focus-follows-window 2",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]
alt-shift-3 = [
  "move-node-to-workspace --focus-follows-window 3",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]
alt-shift-4 = [
  "move-node-to-workspace --focus-follows-window 4",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]
alt-shift-5 = [
  "move-node-to-workspace --focus-follows-window 5",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]
alt-shift-6 = [
  "move-node-to-workspace --focus-follows-window 6",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]

ctrl-shift-h = [
  "move-node-to-monitor left",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]
ctrl-shift-j = [
  "move-node-to-monitor down",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]
ctrl-shift-k = [
  "move-node-to-monitor up",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]
ctrl-shift-l = [
  "move-node-to-monitor right",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]
ctrl-shift-leftSquareBracket = [
  "move-node-to-monitor prev",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]
ctrl-shift-rightSquareBracket = [
  "move-node-to-monitor next",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]

ctrl-alt-shift-h = [
  "move-node-to-monitor --focus-follows-window left",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]
ctrl-alt-shift-j = [
  "move-node-to-monitor --focus-follows-window down",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]
ctrl-alt-shift-k = [
  "move-node-to-monitor --focus-follows-window up",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]
ctrl-alt-shift-l = [
  "move-node-to-monitor --focus-follows-window right",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]
ctrl-alt-shift-leftSquareBracket = [
  "move-node-to-monitor --focus-follows-window prev",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]
ctrl-alt-shift-rightSquareBracket = [
  "move-node-to-monitor --focus-follows-window next",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
