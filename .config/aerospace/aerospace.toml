# =============================================================================
# GLOBAL SETTINGS
# =============================================================================
config-version = 2

start-at-login = true
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

gaps.inner.horizontal = 8
gaps.inner.vertical = 8
gaps.outer.left = 12
gaps.outer.bottom = 12
gaps.outer.top = 12
gaps.outer.right = 12

after-startup-command = [
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]

# =============================================================================
# MAIN MODE
# =============================================================================
# Hyper is emitted by physical Left Control via Karabiner:
# cmd + ctrl + alt + shift.
[mode.main.binding]
alt-space = [
  "mode leader",
  "exec-and-forget borders active_color=0xfff9e2af inactive_color=0xff494d64 width=7.0",
]

# Hyper navigation: fast, always available, no modal state.
"cmd-ctrl-alt-shift-h" = "focus left"
"cmd-ctrl-alt-shift-j" = "focus down"
"cmd-ctrl-alt-shift-k" = "focus up"
"cmd-ctrl-alt-shift-l" = "focus right"

"cmd-ctrl-alt-shift-leftSquareBracket" = "focus dfs-prev"
"cmd-ctrl-alt-shift-rightSquareBracket" = "focus dfs-next"
"cmd-ctrl-alt-shift-tab" = "focus-back-and-forth"

"cmd-ctrl-alt-shift-1" = "workspace 1"
"cmd-ctrl-alt-shift-2" = "workspace 2"
"cmd-ctrl-alt-shift-3" = "workspace 3"
"cmd-ctrl-alt-shift-4" = "workspace 4"
"cmd-ctrl-alt-shift-5" = "workspace 5"
"cmd-ctrl-alt-shift-6" = "workspace 6"

# =============================================================================
# LEADER MODE
# =============================================================================
# One-shot command palette. Commands return to main unless they explicitly enter
# another mode.
[mode.leader.binding]
esc = [
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]
enter = [
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]

# Swallow common macOS app/window shortcuts while AeroSpace owns the leader.
"cmd-h" = "true"
"cmd-m" = "true"
"cmd-w" = "true"

"shift-slash" = [
  "exec-and-forget /bin/zsh -lc '~/.config/aerospace/show-leader-help.sh'",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]
d = [
  "exec-and-forget /bin/zsh -lc '~/.config/aerospace/show-diagnostics.sh'",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]

a = [
  "mode adjust",
  "exec-and-forget borders active_color=0xffff5f57 inactive_color=0xff494d64 width=8.0",
]

z = [
  "fullscreen",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]
f = [
  "layout floating tiling",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]
backspace = [
  "flatten-workspace-tree",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]
equal = [
  "balance-sizes",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]

1 = [
  "workspace 1",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]
2 = [
  "workspace 2",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]
3 = [
  "workspace 3",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]
4 = [
  "workspace 4",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]
5 = [
  "workspace 5",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]
6 = [
  "workspace 6",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]

"shift-1" = [
  "move-node-to-workspace 1",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]
"shift-2" = [
  "move-node-to-workspace 2",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]
"shift-3" = [
  "move-node-to-workspace 3",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]
"shift-4" = [
  "move-node-to-workspace 4",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]
"shift-5" = [
  "move-node-to-workspace 5",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]
"shift-6" = [
  "move-node-to-workspace 6",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]

"alt-shift-1" = [
  "move-node-to-workspace --focus-follows-window 1",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]
"alt-shift-2" = [
  "move-node-to-workspace --focus-follows-window 2",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]
"alt-shift-3" = [
  "move-node-to-workspace --focus-follows-window 3",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]
"alt-shift-4" = [
  "move-node-to-workspace --focus-follows-window 4",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]
"alt-shift-5" = [
  "move-node-to-workspace --focus-follows-window 5",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]
"alt-shift-6" = [
  "move-node-to-workspace --focus-follows-window 6",
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]

# =============================================================================
# ADJUST MODE
# =============================================================================
# Sticky layout surgery mode. Escape or Enter returns to main.
[mode.adjust.binding]
esc = [
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]
enter = [
  "mode main",
  "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0",
]

"cmd-h" = "true"
"cmd-m" = "true"
"cmd-w" = "true"

"shift-slash" = 'exec-and-forget /bin/zsh -lc "~/.config/aerospace/show-adjust-help.sh"'
d = 'exec-and-forget /bin/zsh -lc "~/.config/aerospace/show-diagnostics.sh"'

h = "move left"
j = "move down"
k = "move up"
l = "move right"

"shift-h" = "join-with left"
"shift-j" = "join-with down"
"shift-k" = "join-with up"
"shift-l" = "join-with right"

1 = "move-node-to-workspace 1"
2 = "move-node-to-workspace 2"
3 = "move-node-to-workspace 3"
4 = "move-node-to-workspace 4"
5 = "move-node-to-workspace 5"
6 = "move-node-to-workspace 6"

s = "layout v_tiles"
v = "layout h_tiles"
"shift-s" = "layout --root v_tiles"
"shift-v" = "layout --root h_tiles"

c = "layout v_accordion"
r = "layout h_accordion"
"shift-c" = "layout --root v_accordion"
"shift-r" = "layout --root h_accordion"

minus = "resize smart -50"
"shift-equal" = "resize smart +50"
equal = "balance-sizes"

backspace = "flatten-workspace-tree"

# =============================================================================
# AUTOMATIC APPLICATION ROUTING & EXCLUSIONS
# =============================================================================
[[on-window-detected]]
if = "test %{app-bundle-id} = com.apple.systempreferences"
run = "layout floating"

[[on-window-detected]]
if = "test %{app-bundle-id} = us.zoom.xos"
run = "layout floating"
